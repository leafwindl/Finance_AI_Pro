# ── 证券知识库文档解析模块 配置文件 ─────────────────────────────
# 所有可调参数：编码检测、清洗规则、标题模式、输出格式

# 编码检测
encoding:
  fallbacks: ["utf-8", "gbk", "gb18030", "gb2312"]
  sample_bytes: 65536

# 文本清洗
cleaner:
  max_consecutive_blank_lines: 2        # 最多连续空行数
  remove_page_numbers: true              # 移除"第X页"类页码
  remove_repeated_title: true            # 检测并移除页眉重复标题
  tab_to_spaces: 4                       # 制表符替换为空格数

# 页眉页脚（配置化正则，可增加新规则）
header_footer:
  enabled: true
  patterns:
    - "^第\\s*\\d+\\s*页\\s*$"          # 第1页
    - "^第\\s*\\d+\\s*页\\s*/\\s*共\\s*\\d+\\s*页\\s*$"  # 第1页/共10页
    - "^\\d+\\s*/\\s*\\d+\\s*$"          # 1/10
    - "^［\\d+］$"                         # ［1］
    - "^\\[\\d+\\]$"                       # [1]

# 标题识别（多特征评分）
headings:
  # 评分阈值
  scoring:
    score_threshold: 60       # ≥此分数确认标题
    weak_threshold: 40        # 40-59 弱标题，需独占一行
    format_weights:
      chapter: 25             # 第X章
      article: 20             # 第X条
      delimiter: 20           # =====
      cn_numbered: 18         # 一、二、
      cn_paren: 15            # （一）（二）
      bracket: 15             # 【】
      labeled: 8              # 标签：

  # 无序号标题关键词库（研究报告/公告常见章节名）
  # H1 候选：文档级主标题
  h1_candidates:
    - "重要提示"
    - "摘要"
    - "核心观点"
    - "投资摘要"
    - "内容提要"
    - "前言"
    - "概述"
  # H2 候选：章节级标题
  h2_candidates:
    - "投资观点"
    - "行业分析"
    - "盈利预测"
    - "风险提示"
    - "事项概述"
    - "影响分析"
    - "公司概况"
    - "估值分析"
    - "财务分析"
    - "管理原则"
    - "执行要求"
    - "适用范围"
    - "业务要求"
    - "操作流程"
    - "信息披露要求"
    - "监管要求"
    - "法律责任"
    - "附则"
    - "定义"
    - "基本要求"
    - "相关法规"
    - "市场分析"
    - "投资建议"
    - "合规要求"
    # 知识库章节标签（标签行升级 → H2）
    - "前置环境准备"
    - "操作执行步骤"
    - "预期结果标准"
    - "缺陷完整现象复现步骤"
    - "根因详细分析"
    - "深度根因"
    - "完整修复方案"
    - "全套修复落地方案"
    - "漏测复盘经验"
    - "修复后回归测试用例清单"
    - "修复后完整回归测试覆盖清单"
    - "故障风险影响"
    - "故障风险影响说明"
    - "配套日志优化"
    - "需求存在的模糊待确认项清单"
    - "需求原文片段"
    - "完整业务规则原文"
    - "边界场景约束"
    - "错误码映射"
    - "关联测试用例"
    - "历史缺陷关联"
    - "评审案例参考"
    - "回归范围"
    - "回归执行说明"
    - "正反示例"
    - "知识库联动规则"
    - "批量委托专项额外门禁"
    - "权限校验类用例专项门禁"
    - "全局六库协作"
    - "详细执行操作步骤"
    - "分层预期结果"
    - "测试后置清理操作"
    - "阶段 1"
    - "阶段 2"
    - "阶段 3"
    - "阶段 4"
    - "阶段 5"

  # 条款模式
  article_patterns:
    enabled: true

  # 章/节模式
  chapter_patterns:
    enabled: true

  # 长行独立阈值：≥此长度的行视为独立知识块（fragment），不参与段落合并，输出加 --- 分隔
  long_line_threshold: 150

  # 无序号标题最小/最大长度（字符）
  keyword_title_min_length: 4
  keyword_title_max_length: 40

  # H3 候选（保留为空——标签型章节已移至 H2，H3 由（一）（二）等格式模式覆盖）
  h3_candidates:
    # 测试用例类
    - "前置环境准备"
    - "操作执行步骤"
    - "预期结果标准"
    # 缺陷类
    - "缺陷完整现象复现步骤"
    - "根因详细分析"
    - "深度根因"
    - "完整修复方案"
    - "全套修复落地方案"
    - "漏测复盘经验"
    - "修复后回归测试用例清单"
    - "修复后完整回归测试覆盖清单"
    - "故障风险影响"
    - "配套日志优化"
    # 需求案例类
    - "需求存在的模糊待确认项清单"
    - "需求原文片段"
    # 业务规则类
    - "完整业务规则原文"
    - "边界场景约束"
    - "错误码映射"
    - "关联测试用例"
    - "历史缺陷关联"
    - "评审案例参考"
    - "回归范围"
    - "回归执行说明"
    # 规范类
    - "正反示例"
    - "知识库联动规则"
    - "批量委托专项额外门禁"
    - "权限校验类用例专项门禁"
    - "全局六库协作"
    # 测试用例类
    - "详细执行操作步骤"
    - "分层预期结果"
    - "测试后置清理操作"
    # 通用阶段
    - "阶段 1"
    - "阶段 2"
    - "阶段 3"
    - "阶段 4"
    - "阶段 5"

# Markdown 输出
output:
  article_style: "h3"          # 条款渲染: "h3" | "bold"
  list_marker: "-"             # 列表标记符
  spacing:
    before_h1: 2               # H1 前空行数
    between_blocks: 1          # 块间空行数

