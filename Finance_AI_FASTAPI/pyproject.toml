[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-ai-backend"
version = "0.1.0"
description = "FastAPI gateway for Finance AI LangGraph agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
    "python-multipart>=0.0.14",
    "asyncpg>=0.29,<1.0",
    "bcrypt>=4.0,<5.0",
    "email-validator>=2.2,<3.0",
    "PyMuPDF>=1.24,<2.0",
    "python-docx>=1.1,<2.0",
    "openpyxl>=3.1,<4.0",
    "langchain>=1.3.14",
    "langchain-core>=1.5.2",
    "langgraph>=1.2.10",
    "langchain-deepseek>=1.1.0",
    "langchain-openai>=1.4.1",
    "langchain-community>=0.4.2",
    "chromadb>=1.5.9",
    "easyocr>=1.7",
    "neo4j>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
